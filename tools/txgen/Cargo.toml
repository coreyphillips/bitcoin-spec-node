[package]
name = "bsn-txgen"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Builds regtest blocks full of signed transactions and submits them to a Bitcoin Core node"

[[bin]]
name = "bsn-txgen"
path = "src/main.rs"

[dependencies]
bsn-consensus = { path = "../../crates/consensus" }
secp256k1 = { version = "0.31", features = ["global-context"] }
serde_json = "1"
rayon = "1"
